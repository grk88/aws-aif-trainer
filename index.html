<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AWS Certified AI Practitioner (AIF-C01) — Training & Exam App</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { aws: { orange: '#FF9900', dark: '#232F3E', blue: '#0073BB' } } } } };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-slate-950">

  <!-- Authentication Modal -->
  <div id="authModal" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-4">
      <div class="text-center mb-6">
        <div class="w-12 h-12 mx-auto rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg mb-3">AI</div>
        <h2 class="text-xl font-bold text-white">Cloud Sync Login</h2>
        <p class="text-xs text-slate-400 mt-1">Sign in to sync progress across devices</p>
      </div>
      <input type="email" id="emailInput" placeholder="Email Address" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-amber-500" />
      <input type="password" id="passwordInput" placeholder="Password" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-amber-500" />
      <div id="authError" class="text-xs text-rose-400 hidden text-center"></div>
      <div class="flex gap-2 pt-2">
        <button id="loginBtn" class="flex-1 px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm transition">Log In</button>
        <button id="signupBtn" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm transition border border-slate-700">Sign Up</button>
      </div>
    </div>
  </div>

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-black text-lg shadow-lg">AI</div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight flex items-center gap-2">
            AWS AIF-C01 Trainer
            <span id="bankCountBadge" class="text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 font-medium">0 Qs</span>
          </h1>
          <p class="text-xs text-slate-400 flex items-center gap-2">
            <span id="userDisplay" class="text-emerald-400 font-medium"></span>
            <button id="logoutBtn" class="hidden hover:text-white underline">Log Out</button>
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <div class="inline-flex rounded-lg bg-slate-800 p-1 border border-slate-700 text-xs font-medium">
          <button id="modeTrainingBtn" onclick="window.setMode('training')" class="px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 font-semibold transition">Training Mode</button>
          <button id="modeExamBtn" onclick="window.setMode('exam')" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition">Mock Exam</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Live Score & Filter Bar -->
  <section class="bg-slate-900/60 border-b border-slate-800/80 px-4 py-2.5">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm flex-wrap">
        <div class="flex items-center gap-1.5 bg-slate-800/90 px-3 py-1 rounded-lg border border-slate-700">
          <span class="text-slate-400">Score:</span><span id="scorePct" class="font-bold text-amber-400">0%</span>
        </div>
        <div class="flex items-center gap-1.5 bg-emerald-950/60 px-2.5 py-1 rounded-lg border border-emerald-800/60 text-emerald-300">
          <span>✔ Correct:</span><strong id="statCorrect">0</strong>
        </div>
        <div class="flex items-center gap-1.5 bg-rose-950/60 px-2.5 py-1 rounded-lg border border-rose-800/60 text-rose-300">
          <span>✖ Wrong:</span><strong id="statWrong">0</strong>
        </div>
        <div class="flex items-center gap-1.5 bg-slate-800/60 px-2.5 py-1 rounded-lg border border-slate-700 text-slate-300">
          <span>Remaining:</span><strong id="statRemaining">0</strong>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <select id="filterSelect" onchange="window.applyFilter(this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-amber-500">
          <option value="all">All Questions</option>
          <option value="unanswered">Unanswered Only</option>
          <option value="wrong">Incorrect Only</option>
          <option value="correct">Correct Only</option>
          <option value="flagged">⭐ Flagged</option>
        </select>
        <button onclick="window.resetProgress()" class="text-rose-400 hover:text-rose-300 px-2 py-1 rounded hover:bg-rose-950/40 transition">Reset</button>
      </div>
    </div>
  </section>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 p-4 sm:p-6">
    <div class="lg:col-span-8 xl:col-span-9 flex flex-col gap-4">
      <div id="questionCard" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-7 shadow-xl flex flex-col gap-5">
        <div class="flex items-center justify-between gap-2 border-b border-slate-800 pb-4">
          <div class="flex items-center gap-2.5">
            <span id="qNumberBadge" class="px-3 py-1 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-300 font-bold text-sm">Loading...</span>
            <span id="qMultiBadge" class="hidden px-2.5 py-1 rounded-lg bg-purple-500/20 border border-purple-500/30 text-purple-300 text-xs font-semibold"></span>
          </div>
          <button id="flagBtn" onclick="window.toggleFlag()" class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-800 text-slate-300 transition">
            <span id="flagIcon">☆</span><span id="flagText">Flag</span>
          </button>
        </div>
        
        <div id="qText" class="text-base sm:text-lg text-slate-100 leading-relaxed whitespace-pre-line font-normal">Fetching questions from server...</div>
        
        <!-- Options for standard MCQ -->
        <div id="optionsContainer" class="flex flex-col gap-3"></div>

        <!-- Self-Grade Container for Non-MCQ -->
        <div id="selfGradeContainer" class="hidden flex flex-col gap-3 items-center py-4 bg-slate-950/50 rounded-xl border border-slate-800">
           <button id="revealBtn" onclick="window.revealSelfGrade()" class="px-6 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm shadow-lg transition">Reveal Official Answer</button>
           <div id="gradeButtons" class="hidden flex gap-4 w-full justify-center">
             <p class="w-full text-center text-xs text-slate-400 mb-2 font-medium uppercase tracking-wider block">Did you get this correct?</p>
             <button onclick="window.submitSelfGrade(true)" class="px-6 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm shadow-lg transition">✔ Yes</button>
             <button onclick="window.submitSelfGrade(false)" class="px-6 py-2 rounded-xl bg-rose-500 hover:bg-rose-400 text-white font-bold text-sm shadow-lg transition">✖ No</button>
           </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-800">
          <div class="flex items-center gap-2">
            <button onclick="window.prevQuestion()" id="prevBtn" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium transition disabled:opacity-40">← Prev</button>
            <button onclick="window.nextQuestion()" id="nextBtn" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium transition disabled:opacity-40">Next →</button>
          </div>
          <div class="flex items-center gap-2.5">
            <button id="checkBtn" onclick="window.submitAnswer()" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shadow-lg transition">Check Answer</button>
          </div>
        </div>
        
        <div id="explanationBox" class="hidden mt-2 rounded-xl bg-slate-950/90 border border-slate-800 p-5 text-sm leading-relaxed text-slate-300 space-y-3">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <span class="font-bold text-slate-100">📖 Explanation</span>
            <span id="correctAnsLabel" class="px-2.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold text-xs border border-emerald-500/30"></span>
          </div>
          <div id="explanationText" class="whitespace-pre-line text-slate-300 leading-relaxed"></div>
        </div>
      </div>
    </div>

    <aside class="lg:col-span-4 xl:col-span-3 flex flex-col gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-sm text-slate-200">Navigator</h2><span id="gridCounter" class="text-xs text-slate-400"></span>
        </div>
        <div id="questionGrid" class="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-5 gap-1.5 max-h-[420px] overflow-y-auto custom-scroll pr-1"></div>
      </div>
    </aside>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARAkrwLms-E_jaDEjhu2zomGQaEPcD3qw",
      authDomain: "aif-trainer.firebaseapp.com",
      projectId: "aif-trainer",
      storageBucket: "aif-trainer.firebasestorage.app",
      messagingSenderId: "319928107581",
      appId: "1:319928107581:web:d68fff2f142c3ea9f3e054",
      databaseURL: "https://aif-trainer-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let allQuestions = [];
    let filteredIndices = [];
    let currentPos = 0;
    let renderedPos = -1;
    let selectedOptions = new Set();
    let userProgress = {}; 
    let appMode = 'training';
    let currentUser = null;

    const authModal = document.getElementById('authModal');
    const emailInput = document.getElementById('emailInput');
    const passInput = document.getElementById('passwordInput');
    const authError = document.getElementById('authError');

    document.getElementById('loginBtn').onclick = () => {
      signInWithEmailAndPassword(auth, emailInput.value, passInput.value).catch(err => { authError.textContent = err.message; authError.classList.remove('hidden'); });
    };

    document.getElementById('signupBtn').onclick = () => {
      createUserWithEmailAndPassword(auth, emailInput.value, passInput.value).catch(err => { authError.textContent = err.message; authError.classList.remove('hidden'); });
    };

    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authModal.classList.add('hidden');
        document.getElementById('userDisplay').textContent = "👤 " + user.email;
        document.getElementById('logoutBtn').classList.remove('hidden');
        
        onValue(ref(db, 'users/' + user.uid + '/progress'), (snapshot) => {
          userProgress = snapshot.val() || {};
          if (allQuestions.length > 0) {
             renderedPos = -1; 
             // Using renderAll() instead of window.applyFilter() prevents the UI from jumping to Q1
             renderAll();
          }
        });
      } else {
        currentUser = null;
        userProgress = {};
        authModal.classList.remove('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
        document.getElementById('userDisplay').textContent = "";
      }
    });

    window.saveProgress = function() {
      if (currentUser) {
        set(ref(db, 'users/' + currentUser.uid + '/progress'), userProgress);
      }
    };

    window.initApp = async function() {
      try {
        const res = await fetch('questions.json', { cache: 'no-store' });
        if (res.ok) {
          allQuestions = await res.json();
          document.getElementById('bankCountBadge').textContent = `${allQuestions.length} Qs`;
          window.applyFilter(document.getElementById('filterSelect').value);
          return;
        }
      } catch (e) {}
      document.getElementById('qText').textContent = "Could not find questions.json! Please ensure it is uploaded to your GitHub repository.";
    };

    window.applyFilter = function(filterType) {
      if (allQuestions.length === 0) return;
      let base = allQuestions.map((_, i) => i);
      if (appMode === 'exam') base = base.sort(() => Math.random() - 0.5).slice(0, 65);
      else {
        base = base.filter(i => {
          const p = userProgress[allQuestions[i].id];
          if (filterType === 'unanswered') return !p || !p.selected;
          if (filterType === 'wrong') return p && p.selected && !p.isCorrect;
          if (filterType === 'correct') return p && p.isCorrect;
          if (filterType === 'flagged') return p && p.flagged;
          return true;
        });
      }
      filteredIndices = base;
      currentPos = 0;
      renderedPos = -1;
      renderAll();
    };

    function renderAll() {
      if (filteredIndices.length === 0 || allQuestions.length === 0) {
        document.getElementById('qText').textContent = "No questions match this filter.";
        document.getElementById('optionsContainer').innerHTML = "";
        document.getElementById('explanationBox').classList.add('hidden');
        return;
      }

      let correct = 0, wrong = 0;
      allQuestions.forEach(q => {
        const p = userProgress[q.id];
        if (p && p.selected) { p.isCorrect ? correct++ : wrong++; }
      });
      document.getElementById('scorePct').textContent = `${correct + wrong > 0 ? Math.round((correct/(correct+wrong))*100) : 0}%`;
      document.getElementById('statCorrect').textContent = correct;
      document.getElementById('statWrong').textContent = wrong;
      document.getElementById('statRemaining').textContent = allQuestions.length - (correct + wrong);

      const realIndex = filteredIndices[currentPos];
      const q = allQuestions[realIndex];
      const p = userProgress[q.id] || {};
      
      if (renderedPos !== currentPos) {
        selectedOptions = new Set(p.selected && p.selected !== 'SELF_GRADED' ? p.selected.split('') : []);
        renderedPos = currentPos;
      }
      
      document.getElementById('qNumberBadge').textContent = `Q ${realIndex + 1} (${currentPos + 1}/${filteredIndices.length})`;
      document.getElementById('qText').textContent = q.question;
      document.getElementById('flagIcon').textContent = p.flagged ? '⭐' : '☆';

      const multiBadge = document.getElementById('qMultiBadge');
      if (q.answer && q.answer.length > 1 && q.answer !== "N/A") {
        multiBadge.textContent = `Choose ${q.answer.length}`;
        multiBadge.classList.remove('hidden');
      } else multiBadge.classList.add('hidden');

      const container = document.getElementById('optionsContainer');
      const selfGradeContainer = document.getElementById('selfGradeContainer');
      const checkBtn = document.getElementById('checkBtn');
      const exp = document.getElementById('explanationBox');
      
      const isMCQ = q.options && Object.keys(q.options).length >= 2;
      const hasSub = !!p.selected;

      exp.classList.add('hidden');
      
      if (isMCQ) {
        container.classList.remove('hidden');
        selfGradeContainer.classList.add('hidden');
        checkBtn.classList.remove('hidden');
        container.innerHTML = '';
        
        const ansSet = new Set(q.answer.split(''));
        Object.entries(q.options).forEach(([k, v]) => {
          let style = selectedOptions.has(k) ? 'border-amber-500 bg-amber-500/10 text-white' : 'border-slate-800 bg-slate-950/60 text-slate-200';
          if (hasSub) {
            if (ansSet.has(k)) style = 'border-emerald-500/80 bg-emerald-950/30 text-emerald-100';
            else if (selectedOptions.has(k)) style = 'border-rose-500/80 bg-rose-950/30 text-rose-100';
          }
          container.innerHTML += `<button onclick="window.selectOption('${k}', ${q.answer.length > 1})" class="w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3.5 ${style}"><span class="w-7 h-7 rounded-lg border flex items-center justify-center text-xs shrink-0 bg-slate-800">${k}</span><span class="text-sm sm:text-base flex-1">${v.replace(/</g, '&lt;')}</span></button>`;
        });

        if (hasSub) {
          document.getElementById('correctAnsLabel').textContent = `Answer: ${q.answer}`;
          document.getElementById('explanationText').textContent = q.explanation;
          exp.classList.remove('hidden');
        }
      } else {
        container.classList.add('hidden');
        selfGradeContainer.classList.remove('hidden');
        checkBtn.classList.add('hidden');

        if (hasSub) {
          document.getElementById('revealBtn').classList.add('hidden');
          document.getElementById('gradeButtons').classList.add('hidden');
          
          document.getElementById('correctAnsLabel').textContent = p.isCorrect ? "Marked Correct ✔" : "Marked Incorrect ✖";
          document.getElementById('explanationText').textContent = `${q.answer !== "N/A" ? 'Answer: ' + q.answer + '\n\n' : ''}${q.explanation}`;
          exp.classList.remove('hidden');
        } else {
          document.getElementById('revealBtn').classList.remove('hidden');
          document.getElementById('gradeButtons').classList.add('hidden');
        }
      }

      document.getElementById('prevBtn').disabled = currentPos === 0;
      document.getElementById('nextBtn').disabled = currentPos >= filteredIndices.length - 1;
      renderGrid();
    }

    window.revealSelfGrade = function() {
      document.getElementById('revealBtn').classList.add('hidden');
      document.getElementById('gradeButtons').classList.remove('hidden');
      
      const q = allQuestions[filteredIndices[currentPos]];
      document.getElementById('correctAnsLabel').textContent = "Official Answer";
      document.getElementById('explanationText').textContent = `${q.answer !== "N/A" ? 'Answer: ' + q.answer + '\n\n' : ''}${q.explanation}`;
      document.getElementById('explanationBox').classList.remove('hidden');
    };

    window.submitSelfGrade = function(isCorrect) {
      const q = allQuestions[filteredIndices[currentPos]];
      userProgress[q.id] = { ...userProgress[q.id], selected: 'SELF_GRADED', isCorrect: isCorrect };
      window.saveProgress();
      renderAll();
    };

    window.selectOption = function(k, multi) {
      if (multi) selectedOptions.has(k) ? selectedOptions.delete(k) : selectedOptions.add(k);
      else { selectedOptions.clear(); selectedOptions.add(k); }
      const qId = allQuestions[filteredIndices[currentPos]].id;
      if (userProgress[qId]?.selected) { delete userProgress[qId].selected; }
      renderAll();
    };

    window.submitAnswer = function() {
      const q = allQuestions[filteredIndices[currentPos]];
      if (selectedOptions.size === 0) return alert('Select an option first');
      const ans = Array.from(selectedOptions).sort().join('');
      userProgress[q.id] = { ...userProgress[q.id], selected: ans, isCorrect: ans === q.answer.split('').sort().join('') };
      window.saveProgress();
      renderAll();
    };

    window.setMode = function(m) {
      appMode = m;
      const tBtn = document.getElementById('modeTrainingBtn');
      const eBtn = document.getElementById('modeExamBtn');
      if (m === 'training') {
        tBtn.className = 'px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 font-semibold transition';
        eBtn.className = 'px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition';
      } else {
        eBtn.className = 'px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 font-semibold transition';
        tBtn.className = 'px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition';
      }
      window.applyFilter('all');
    };

    window.jumpToPos = function(pos) { currentPos = pos; renderedPos = -1; renderAll(); };
    window.nextQuestion = () => { if (currentPos < filteredIndices.length - 1) { currentPos++; renderedPos = -1; renderAll(); } };
    window.prevQuestion = () => { if (currentPos > 0) { currentPos--; renderedPos = -1; renderAll(); } };
    window.toggleFlag = () => { const qId = allQuestions[filteredIndices[currentPos]].id; userProgress[qId] = { ...userProgress[qId], flagged: !userProgress[qId]?.flagged }; window.saveProgress(); renderAll(); };
    window.resetProgress = () => { if(confirm('Reset all progress and scores?')) { userProgress = {}; window.saveProgress(); renderedPos = -1; renderAll(); } };

    function renderGrid() {
      const g = document.getElementById('questionGrid');
      g.innerHTML = '';
      filteredIndices.forEach((idx, pos) => {
        const p = userProgress[allQuestions[idx].id] || {};
        let c = p.selected ? (p.isCorrect ? 'bg-emerald-600/30 border-emerald-500/50' : 'bg-rose-600/30 border-rose-500/50') : 'bg-slate-800 border-slate-700';
        if (p.flagged) c += ' ring-2 ring-amber-400';
        if (pos === currentPos) c += ' border-2 border-white scale-105';
        
        g.innerHTML += `<button onclick="window.jumpToPos(${pos})" class="h-9 rounded-lg border text-xs transition ${c}">${idx + 1}</button>`;
      });
    }

    window.initApp();
  </script>
</body>
</html>
